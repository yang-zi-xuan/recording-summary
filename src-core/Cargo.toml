[package]
name = "rs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rs_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
directories.workspace = true
tempfile.workspace = true
walkdir.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
quick-xml = "0.37"

# 说话人区分。关掉默认的 tts feature(用不到,且会多拉依赖),
# 保留 download-binaries 以免每次都要本地编译 sherpa-onnx 的 C++。
# 构建需要 LIBCLANG_PATH,见 scripts/cargo.ps1。
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries"] }

[dev-dependencies]
